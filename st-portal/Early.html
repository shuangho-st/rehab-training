<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<title>早療語言評估 手機版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* Layout: single-column phone app — sticky step header, scrolling card stack, fixed bottom nav */
:root{
  --bg:#F3F5F3; --card:#FFFFFF; --ink:#1C2421; --ink2:#5B6662; --ink3:#8C9893;
  --line:#DCE2DE; --accent:#1F5F5B; --accent-ink:#FFFFFF; --wash:#E2EEEB;
  --ok:#2F7D4F; --ok-w:#E3F2E8; --mid:#9C6B0E; --mid-w:#FBF0D9; --hard:#B3473D; --hard-w:#FAE6E3;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-disp:"Noto Serif TC","Songti TC",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --card:#1A211F; --ink:#E5EBE8; --ink2:#A0ACA7; --ink3:#73807A;
  --line:#2D3734; --accent:#63B5AA; --accent-ink:#0E1A18; --wash:#1D322F;
  --ok:#72C491; --ok-w:#1C2F24; --mid:#E2B356; --mid-w:#33291A; --hard:#EA8E84; --hard-w:#3A2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --card:#1A211F; --ink:#E5EBE8; --ink2:#A0ACA7; --ink3:#73807A;
  --line:#2D3734; --accent:#63B5AA; --accent-ink:#0E1A18; --wash:#1D322F;
  --ok:#72C491; --ok-w:#1C2F24; --mid:#E2B356; --mid-w:#33291A; --hard:#EA8E84; --hard-w:#3A2220; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.app{font-size:12px;color:var(--ink3);letter-spacing:.06em}
h1{font-family:var(--f-disp);font-weight:600;font-size:21px;margin:2px 0 0;text-wrap:balance}
.count{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.tab.done{border-color:var(--accent);color:var(--accent)}
.tab.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

.banner{margin-top:12px;background:var(--mid-w);color:var(--mid);border-radius:var(--r);padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:1px solid currentColor;background:transparent;border-radius:6px;padding:3px 10px;font-size:13px;color:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:12px}
.card>h2{margin:0;font-size:15px;font-weight:700}
.sub{font-size:12px;color:var(--ink3);margin-top:-8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-size:13px;color:var(--ink2);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
textarea{resize:vertical;line-height:1.7}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;min-height:40px;font-size:14px;text-align:left}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg .chip{border:0;border-radius:0;flex:1;text-align:center;border-left:1px solid var(--line)}
.seg .chip:first-child{border-left:0}

.items{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;font-size:14px}
.tri{display:flex;gap:4px;flex:none}
.tri button{border:1px solid var(--line);background:transparent;border-radius:7px;width:48px;height:38px;font-size:13px;color:var(--ink3)}
.tri .ok.on{background:var(--ok-w);border-color:var(--ok);color:var(--ok);font-weight:700}
.tri .mid.on{background:var(--mid-w);border-color:var(--mid);color:var(--mid);font-weight:700}
.tri .hard.on{background:var(--hard-w);border-color:var(--hard);color:var(--hard);font-weight:700}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.legend b{font-weight:500}.legend .a{color:var(--ok)}.legend .m{color:var(--mid)}.legend .h{color:var(--hard)}

.zy{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.zy button{border:1px solid var(--line);background:var(--card);border-radius:7px;height:40px;font-size:16px}
.zy button.has{background:var(--wash);border-color:var(--accent);color:var(--accent);font-weight:700}
.err{border:1px solid var(--line);border-radius:8px;padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--bg)}
.errh{display:flex;justify-content:space-between;align-items:center}
.errh b{font-size:18px}
.del{border:0;background:transparent;color:var(--hard);font-size:13px;padding:4px 6px}
.hint{font-size:12px;color:var(--ink3)}

.out{gap:8px}
.outh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.outh h2{margin:0;font-size:15px}
.outh .hint{margin-top:2px}
.copy{flex:none;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:6px 14px;font-size:14px;min-height:38px}
.copy.did{background:var(--accent);color:var(--accent-ink)}
.out textarea{background:var(--bg);font-size:14px;min-height:120px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bari{max-width:600px;margin:0 auto;display:flex;gap:10px}
.bar button{flex:1;min-height:48px;border-radius:10px;font-size:16px;font-weight:500;border:1px solid var(--line);background:var(--card)}
.bar .pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar button:disabled{opacity:.4}

.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px;font-size:14px;color:var(--ink2)}
.danger{color:var(--hard);border-color:var(--hard)}
.confirm{background:var(--hard-w);color:var(--hard);border-radius:8px;padding:10px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.confirm .chips button{border-color:var(--hard)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* 電腦版：左填寫、右即時預覽 */
#side{display:none}
.layout{min-width:0}
.pv{display:flex;flex-direction:column;gap:10px}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:2px 4px}
.pvh b{font-size:13px;color:var(--ink2);letter-spacing:.06em}
.pvb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pvb .outh{margin-bottom:6px}
.pvb h3{margin:0;font-size:14px}
.pvt{white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--ink)}
@media (min-width:1000px){
  .wrap{max-width:1280px;padding-inline:24px}
  header{margin-inline:-24px;padding-inline:24px}
  .layout{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;align-items:start}
  #side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);max-height:calc(100vh - 210px);overflow-y:auto;margin-top:12px;padding-right:4px}
  .bari{max-width:1280px;padding-inline:24px}
  .bari button{flex:0 0 268px}
  body.wide-out .layout{grid-template-columns:minmax(0,820px)}
  body.wide-out #side{display:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><span class="app">早療語言治療評估 · 115/09 格式</span><span class="count" id="count"></span></div>
    <h1 id="stitle"></h1>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <div class="layout">
    <div class="formcol"><div id="banner"></div><main id="main"></main></div>
    <aside id="side" aria-label="報告即時預覽"></aside>
  </div>
</div>
<div class="bar"><div class="bari"><button id="prev">上一步</button><button id="next" class="pri">下一步</button></div></div>
<div class="toast" id="toast"></div>

/* ===== 工具函式 ===== */
const get=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function set(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nok=v=>v==='mid'||v==='hard';
const isAbn=lv=>lv==='邊緣'||lv==='遲緩';
const langAbn=s=>isAbn(s.lvC)||isAbn(s.lvE)||isAbn(s.lvT);
const under3=()=>S.ageY!==''&&Number(S.ageY)<3;
function J(a){a=a.filter(Boolean);if(!a.length)return'';if(a.length===1)return a[0];return a.slice(0,-1).join('、')+'和'+a[a.length-1]}
const box=(on,t)=>(on?'■':'☐')+t;
const opts=(list,sel)=>list.map(t=>box(sel===t,t)).join('　');

const seg=(path,list)=>{const cl=path.startsWith('story')?' data-clear="1"':'';return`<div class="seg">${list.map(v=>`<button class="chip${get(S,path)===v?' on':''}" data-set="${path}" data-val="${esc(v)}"${cl}>${esc(v)}</button>`).join('')}</div>`};
const chips=(path,list,multi)=>`<div class="chips">${list.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];const cv=get(S,path);const on=multi?(cv||[]).includes(v):cv===v;return`<button class="chip${on?' on':''}" data-${multi?'tog':'set'}="${path}" data-val="${esc(v)}"${multi?'':' data-clear="1"'}>${esc(l)}</button>`}).join('')}</div>`;
const inp=(path,ph,type='text',mode='')=>`<input type="${type}" id="i-${path.replace(/\./g,'-')}" data-in="${path}" value="${esc(get(S,path))}" placeholder="${esc(ph)}"${mode?` inputmode="${mode}"`:''}>`;
const tri=(grp,list)=>`<div class="legend"><b class="a">可以</b><b class="m">不穩定</b><b class="h">較困難</b><span>未點選＝未評估</span></div><div class="items">${list.map(([id,l])=>{const v=S[grp][id];return`<div class="item"><span class="t">${esc(l)}</span><span class="tri">${[['ok','可以'],['mid','不穩'],['hard','較難']].map(([k,t])=>`<button class="${k}${v===k?' on':''}" data-tri="${grp}.${id}" data-val="${k}" aria-label="${esc(l)} ${t}">${t}</button>`).join('')}</span></div>`}).join('')}</div>`;
const F=(lab,html)=>`<div class="field"><span class="lab">${lab}</span>${html}</div>`;

 const c=[];if(nok(s.c.cmd1))c.push(C_DIR[3]);if(nok(s.c.obj))c.push(C_DIR[4]);if(nok(s.c.adj))c.push(C_DIR[5]);if(nok(s.c.cmd2)||nok(s.c.cmd3))c.push(C_DIR[6]);if(nok(s.c.cplx))c.push(C_DIR[7]);
 if(!under3()&&((s.story.s&&s.story.s<4)||(s.story.l&&s.story.l<4)))c.push(C_DIR[9]);if(nok(s.c.excl))c.push(C_DIR[10]);
 const e=[];if(nok(s.e.w1))e.push(E_DIR[4]);if(nok(s.e.vocab)||nok(s.e.name))e.push(E_DIR[5]);if(nok(s.e.full))e.push(E_DIR[6]);if(nok(s.e.w2)||nok(s.e.w3))e.push(E_DIR[8]);if(nok(s.e.caus))e.push(E_DIR[9]);
 if(!under3()&&(N_ALL.some(([g,l])=>l.some(([k])=>nok(s[g][k])))||s.nWeak.length))e.push(E_DIR[10]);
 const p=[];if(s.it.turn&&s.it.turn!=='佳')p.push(P_DIR[2]);if(!s.it.func.includes('開啟話題'))p.push(P_DIR[5]);if(!s.it.func.includes('主動分享')||!s.it.func.includes('主動提問'))p.push(P_DIR[7]);
 const o=[];STRUCT.forEach((x,i)=>{if(s.o.mo!=='無異常'&&s.o.st[x]&&s.o.st[x]!=='良好'){if(x==='口腔感覺')o.push('減/增敏感訓練');else if(x!=='雙頰')o.push(x+'動作訓練')}});
 s.dir={c,e,p,o};
 s.need.c=lvNeed(s.lvC,c);s.need.e=lvNeed(s.lvE,e);
 s.need.p=p.length?(s.it.eye==='較困難'||s.it.turn==='較難'?'需要訓練':'需要追蹤及諮詢'):'不需要';
 s.need.o=s.o.mo==='異常'?'需要訓練':s.o.mo==='臨界'?'需要追蹤及諮詢':'不需要';
 s.need.s=(s.o.sw==='異常')?'需要訓練':s.o.sw==='臨界'?'需要追蹤及諮詢':'不需要';
 s.home=HOME.filter(h=>{try{return h[3](s)}catch(_){return false}}).map(h=>h[0]);
 if(under3())s.home=s.home.filter(k=>!['conn','logic','cplxE'].includes(k));
 s.freq=(langAbn(s)||s.artic==='異常'||s.o.mo==='異常')?'至少一周一次':'暫不需治療';
}

 const cA=isAbn(S.lvC),eA=isAbn(S.lvE);let d;
 if(!cA&&!eA&&!isAbn(S.lvT))d='語言發展正常';else if(cA&&eA)d='發展性語言異常';else if(eA)d='發展性語言異常（口語表達為主）';else if(cA)d='發展性語言異常（語言理解為主）';else d='發展性語言異常';

function triSentence(map,list,verb,tail){
 const g=k=>list.filter(([id])=>map[id]===k).map(x=>x[1]);
 const ok=g('ok'),mid=g('mid'),hard=g('hard');const p=[];
 if(ok.length)p.push('孩子目前可以'+verb+J(ok));
 if(mid.length)p.push((ok.length?'':'孩子')+verb.replace(/^理解$/,'')+J(mid)+(verb==='理解'?'的理解':'')+'尚不穩定，部分時候需要'+tail);
 if(hard.length)p.push(J(hard)+(verb==='理解'?'的理解':'')+'則較困難，尚待發展');
 return p.length?p.join('；')+'。':'';
}

/* ===== 綜合版 Word 表格（依院內範本自動填入） ===== */
const WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const kids=(el,tag)=>[...el.childNodes].filter(n=>n.nodeName===tag);
const allT=p=>[...p.getElementsByTagName('w:t')];
const strip=s=>s.replace(/[\s　]/g,'');
const pText=p=>allT(p).map(t=>t.textContent).join('');
function setT(t,str){while(t.firstChild)t.removeChild(t.firstChild);t.appendChild(t.ownerDocument.createTextNode(str));t.setAttribute('xml:space','preserve')}
/* 把「☐+label」的方框改成 ■ */
function tickP(p,label){
 const map=[];allT(p).forEach(t=>{[...t.textContent].forEach((ch,i)=>{if(!/[\s　]/.test(ch))map.push([t,i,ch])})});
 const s=map.map(m=>m[2]).join('');const L=strip(label);let from=0,k;
 while((k=s.indexOf(L,from))>-1){if(k>0&&s[k-1]==='☐'){const [t,i]=map[k-1];const a=[...t.textContent];a[i]='■';setT(t,a.join(''));return true}from=k+1}
 return false;
}
function tick(cell,label){if(!label)return false;for(const p of cell.getElementsByTagName('w:p'))if(tickP(p,label))return true;return false}
function findP(cell,start,nth=0){let n=0;for(const p of cell.getElementsByTagName('w:p'))if(strip(pText(p)).startsWith(strip(start))){if(n++===nth)return p}return null}
/* 依序填入 ____ 空格 */
function blanks(p,vals){if(!p)return;let i=0;allT(p).forEach(t=>{if(/^_+\s*$/.test(t.textContent)&&i<vals.length){const v=vals[i++];if(v!==''&&v!=null)setT(t,String(v))}})}
function addRun(p,text){const d=p.ownerDocument;const r=d.createElementNS(WNS,'w:r');const src=p.getElementsByTagName('w:rPr')[0];if(src&&src.parentNode.nodeName==='w:r'){const rp=src.cloneNode(true);kids(rp,'w:b').concat(kids(rp,'w:bCs')).forEach(b=>rp.removeChild(b));r.appendChild(rp)}const t=d.createElementNS(WNS,'w:t');r.appendChild(t);setT(t,text);p.appendChild(r)}
function newP(tpl,text){const p=tpl.cloneNode(true);kids(p,'w:r').forEach(r=>p.removeChild(r));[...p.childNodes].filter(n=>n.nodeName!=='w:pPr').forEach(n=>p.removeChild(n));
 const src=tpl.getElementsByTagName('w:rPr');const d=p.ownerDocument;const r=d.createElementNS(WNS,'w:r');
 const rp=[...src].find(x=>x.parentNode.nodeName==='w:r');if(rp){const c=rp.cloneNode(true);kids(c,'w:b').concat(kids(c,'w:bCs')).forEach(b=>c.removeChild(b));r.appendChild(c)}
 const t=d.createElementNS(WNS,'w:t');r.appendChild(t);setT(t,text);p.appendChild(r);return p}
/* 在某段落後插入多段文字；若後面緊接空白佔位段落則取代 */
function insertAfter(p,text){
 if(!p||!text)return;const lines=String(text).split('\n').filter(x=>x.trim());if(!lines.length)return;
 let nx=p.nextSibling;while(nx&&nx.nodeName!=='w:p'&&nx.nodeName!=='w:tbl')nx=nx.nextSibling;
 const filler=nx&&nx.nodeName==='w:p'&&!strip(pText(nx))?nx:null;
 const tpl=filler||p;let ref=p;
 lines.forEach(l=>{const np=newP(tpl,l);ref.parentNode.insertBefore(np,ref.nextSibling);ref=np});
 if(filler)filler.parentNode.removeChild(filler);
}

async function buildDocx(){
 const zip=await JSZip.loadAsync(TPL_B64,{base64:true});
 const xml=await zip.file('word/document.xml').async('string');
 const doc=new DOMParser().parseFromString(xml,'application/xml');
 fillDoc(doc);
 zip.file('word/document.xml',new XMLSerializer().serializeToString(doc));
 return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
async function saveDocx(btn){
 btn.disabled=true;const old=btn.textContent;btn.textContent='產生中…';
 try{
  if(typeof JSZip==='undefined')throw new Error('nolib');
  const blob=await buildDocx();
  const d=(S.date||today()).replace(/-/g,'');
  const name='ST_combined_'+d+'.docx';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('已下載：'+name);
 }catch(e){
  toast(e&&e.message==='nolib'?'元件載入失敗，請重新整理':'下載失敗，請改用下方複製');
 }finally{btn.disabled=false;btn.textContent=old}
}
